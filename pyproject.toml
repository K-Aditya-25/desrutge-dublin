[project]
name = "desrutge"
version = "0.1.0"
description = "DesRUTGe Dublin adaptation for SUMO-backed traffic generation and decentralized federated learning"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "argparse==1.1",
    "colorama==0.4.6",
    "gymnasium==0.29.1",
    "lxml",
    "matplotlib==3.7.1",
    "mpltex==0.7",
    "numpy==1.24.1",
    "osmium",
    "pandas==1.5.3",
    "scikit-learn==1.4.1.post1",
    "scipy==1.11.3",
    "seaborn==0.13.0",
    "shapely",
    "stable-baselines3==2.2.1",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "tqdm==4.65.0",
    "urllib3==1.26.7",
]

[tool.uv]
package = false
